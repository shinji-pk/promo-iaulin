name: Guia do cliente | Teste no navegador
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guia-cliente-e2e.yml'
      - 'apps/web/src/LocalSetupWizard.tsx'
      - 'apps/web/src/setup-wizard.css'
      - 'tests/e2e/account.spec.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-guia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ler projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Preparar navegador para o teste
        run: npx playwright install --with-deps chromium
      - name: Compilar site e painel local
        run: npm run build
      - name: Testar a instalacao guiada no navegador
        run: npx playwright test tests/e2e/account.spec.ts --project=desktop --project=mobile
      - name: Guardar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guia-visual-browser-qa
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
