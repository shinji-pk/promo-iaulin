name: Promo IAulin | Parser PR
on:
  pull_request:
    paths:
      - 'packages/core/src/parser.ts'
      - 'tests/core.test.ts'
      - 'tests/conditional-discount.test.ts'
      - '.github/workflows/promo-parser-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run tests/conditional-discount.test.ts tests/core.test.ts
