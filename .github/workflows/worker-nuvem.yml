name: Servidor do WhatsApp | Validação
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'render.yaml'
      - 'apps/**'
      - 'packages/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/worker-nuvem.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - name: Construir imagem do servidor
        run: docker build -t promo-iaulin-whatsapp .
      - name: Testar servidor em modo nuvem
        run: |
          TOKEN=$(head -c 33 /dev/urandom | base64 | tr -d '\n=+/')
          if ! out=$(docker run -d --name w -p 127.0.0.1::10000 -e PROMOBRIDGE_CLOUD_TOKEN="$TOKEN" promo-iaulin-whatsapp 2>&1); then
            echo "::error title=docker run falhou::$(echo "$out" | tr '\n' '|' | head -c 1500)"; exit 1
          fi
          HOSTPORT=$(docker port w 10000/tcp | head -1 | sed 's/.*://')
          fail() { echo "::error title=$1::$(docker logs w 2>&1 | tail -25 | tr '\n' '|' | head -c 1500)"; docker logs w || true; exit 1; }
          up=0
          for i in $(seq 1 30); do
            if curl -fsS 127.0.0.1:$HOSTPORT/healthz; then up=1; break; fi
            sleep 2
          done
          [ "$up" = 1 ] || fail "Servidor nao subiu"
          anon=$(curl -s -o /dev/null -w '%{http_code}' 127.0.0.1:$HOSTPORT/api/v1/state || true)
          [ "$anon" != 200 ] || fail "Acesso sem senha foi liberado"
          code=$(curl -s -o /tmp/state.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" 127.0.0.1:$HOSTPORT/api/v1/state || true)
          [ "$code" = 200 ] || fail "Acesso com senha falhou ($code) $(head -c 300 /tmp/state.json 2>/dev/null)"
          docker logs w
