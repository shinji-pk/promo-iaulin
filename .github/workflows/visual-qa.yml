name: Visual QA (temporary)
on:
  push:
    branches: ['qa/**']
permissions:
  contents: write
concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - name: Screenshots
        run: |
          python3 -m http.server 4174 -d apps/web/dist &
          sleep 2
          node qa/promo-shots.mjs
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "qa-bot"; git config user.email "qa-bot@users.noreply.github.com"
          git add -f qa-shots || true
          git commit -m "qa: screenshots [skip ci]" || exit 0
          git push
